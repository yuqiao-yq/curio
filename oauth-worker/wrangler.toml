name = "curio-drive-oauth"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = false

[vars]
# Replace with your Worker origin and Google Web application client ID.
PUBLIC_ORIGIN = "https://curio-drive-oauth.YOUR-SUBDOMAIN.workers.dev"
GOOGLE_CLIENT_ID = "YOUR-CLIENT-ID.apps.googleusercontent.com"
# Copy the exact callback shown in Curio on EACH browser; comma-separated, no wildcards.
ALLOWED_REDIRECT_URIS = ""

# Set with `wrangler secret put`, never put secrets here:
# GOOGLE_CLIENT_SECRET
# SESSION_ENCRYPTION_KEY (32 random bytes, base64url)
