<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!--
    Curio · 简化图标（16 / 32 px 用）

    与主图同款配色（蓝渐变背景 + 暖金 ribbon + 淡光晕 C），
    针对小尺寸做的微调：
      - ribbon 略放大且更靠中心 → 16 px 下第一眼能看出「书签」
      - C 同样保留极淡光晕，不抢视觉
  -->
  <defs>
    <linearGradient id="curio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#bee4f8"/>
      <stop offset="100%" stop-color="#619cfb"/>
    </linearGradient>
    <linearGradient id="curio-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#d3bc69"/>
      <stop offset="100%" stop-color="#f4f1e4"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#curio-bg)"/>

  <!-- C：极淡暖白光晕，比主图略大一圈 -->
  <path
    d="M 104 42 A 44 44 0 1 0 104 86"
    fill="none"
    stroke="rgba(237,226,181,0.4)"
    stroke-width="13"
    stroke-linecap="round"
  />

  <!-- ribbon: 主元素，比主图略放大，居中 -->
  <path
    d="M 46 90
       L 46 44
       Q 46 40 50 40
       L 78 40
       Q 82 40 82 44
       L 82 90
       L 64 80 Z"
    fill="url(#curio-ribbon)"
  />
</svg>
